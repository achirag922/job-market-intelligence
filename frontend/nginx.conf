# Behind a TLS-terminating load balancer the original scheme arrives as X-Forwarded-Proto;
# pass "https" on so the backend knows the browser used HTTPS. Otherwise report our own.
map $http_x_forwarded_proto $jmip_forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Do not advertise the nginx version.
    server_tokens off;

    # Resume uploads are capped at 5MB by the backend; leave room for multipart overhead.
    client_max_body_size 6m;

    # Same-origin API: the browser calls this server, which forwards to the backend service.
    # The original Host is kept so the backend sees the request as same-origin. In production
    # Spring trusts X-Forwarded-* and Forwarded, so a client's own X-Forwarded-Host,
    # X-Forwarded-Prefix and Forwarded are dropped (set to "") on every proxied location.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        # Overwritten, not appended: the backend rate-limits by this address, and a client
        # must not be able to choose it by sending its own X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $jmip_forwarded_proto;
        # The AI assistant can take a while to answer.
        proxy_read_timeout 60s;
    }

    # Questions are short; refuse large bodies here before they reach the backend.
    location = /api/assistant/query {
        client_max_body_size 16k;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $jmip_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
    }

    # Hashed build assets never change, so they can be cached for good.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes (/jobs/42, /resume, ...) all load the single-page app.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
