server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resume uploads are capped at 5MB by the backend; leave room for multipart overhead.
    client_max_body_size 6m;

    # Same-origin API: the browser calls this server, which forwards to the backend service.
    # The original Host is kept so the backend sees the request as same-origin.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The AI assistant can take a while to answer.
        proxy_read_timeout 60s;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }

    # Hashed build assets never change, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/jobs/42, /resume, ...) all load the single-page app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
