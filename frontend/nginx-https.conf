# HTTPS termination for production, used by docker-compose.https.yml, which mounts this file
# in place of nginx.conf and mounts the certificate. The certificate decides which host this
# is, so no domain is written here.

# Plain HTTP only redirects (and serves ACME challenges, if a certificate client uses them).
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:JMIP:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 6m;

    # The API's responses come back with the backend's own security headers; HSTS is set once,
    # here, for every response on this host. The backend trusts X-Forwarded-* and Forwarded,
    # so a client's own X-Forwarded-Host, X-Forwarded-Prefix and Forwarded are dropped.
    location /api/ {
        include /etc/nginx/snippets/hsts.conf;
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
    }

    location = /api/assistant/query {
        include /etc/nginx/snippets/hsts.conf;
        proxy_hide_header Strict-Transport-Security;
        client_max_body_size 16k;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 60s;
    }

    location = /actuator/health {
        include /etc/nginx/snippets/hsts.conf;
        proxy_hide_header Strict-Transport-Security;
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto https;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/hsts.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/hsts.conf;
        try_files $uri $uri/ /index.html;
    }
}
