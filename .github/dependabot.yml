# Dependabot: weekly update PRs for Maven, npm and the GitHub Actions used by CI.
#
# Each PR runs the normal CI (build, tests, Docker images) and is never merged automatically,
# so an update that breaks the application shows up as a red PR, not a broken main branch.
# Minor and patch bumps are grouped into one PR per ecosystem; major bumps come one per PR,
# since they are the ones likely to need code changes.
#
# Security-only PRs (for vulnerable versions, outside this schedule) come from "Dependabot
# security updates", switched on in the repository's Settings -> Code security.
version: 2
updates:
  - package-ecosystem: maven
    # The root pom lists the database, backend and etl modules.
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, java]
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
