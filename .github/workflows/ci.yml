name: CI

# V10.3 pipeline: build -> test -> security checks -> Sonar Quality Gate (V10.4) -> Docker images -> container smoke test.
# Any failing step fails the run. Images are only pushed (never deployed) for a v* release tag.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token by default; only the publish job asks for more.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B -ntp package -DskipTests

      # Unit and integration tests for database, backend and ETL. The integration tests
      # start PostgreSQL through Testcontainers, using the runner's Docker daemon; the AI
      # features use the stub client, so no API key is needed.
      - name: Test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

      # V10.4: classes, JaCoCo coverage and test results for the Sonar job.
      - name: Upload analysis inputs
        uses: actions/upload-artifact@v4
        with:
          name: backend-analysis
          path: |
            backend/target/classes/
            backend/target/test-classes/
            backend/target/site/jacoco/jacoco.xml
            backend/target/surefire-reports/
            etl/target/classes/
            etl/target/test-classes/
            etl/target/site/jacoco/jacoco.xml
            etl/target/surefire-reports/
          retention-days: 3

  frontend:
    name: Frontend lint, test, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # The same Node major as frontend/Dockerfile.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # oxlint is already a dev dependency; errors fail the run, warnings are reported.
      - name: Lint
        run: npm run lint

      # V10.4: the same tests, with V8 coverage written as lcov for Sonar.
      - name: Test with coverage
        run: npm run test:coverage

      # Built-in npm audit, runtime dependencies only: a known high or critical
      # vulnerability in what ships to browsers fails the run.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

      # lcov paths are relative to frontend/; Sonar resolves them from the repository root.
      - name: Make coverage paths repository-relative
        run: sed -i 's#^SF:src/#SF:frontend/src/#' coverage/lcov.info

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 3

  sonar:
    name: Sonar analysis and Quality Gate
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history, so Sonar can tell new code from old and attribute issues.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secrets are not given to pull requests from forks or Dependabot; those runs skip the
      # analysis with a warning. Everywhere else a missing token fails the run.
      - name: Check Sonar configuration
        id: config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$UNTRUSTED_PR" = "true" ]; then
            echo "::warning::SONAR_TOKEN is not available to this pull request; Sonar analysis skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::error::Add the SONAR_TOKEN repository secret (see docs/CI_CD.md)."; exit 1

      - uses: actions/download-artifact@v4
        if: steps.config.outputs.run == 'true'
        with:
          name: backend-analysis

      - uses: actions/download-artifact@v4
        if: steps.config.outputs.run == 'true'
        with:
          name: frontend-coverage
          path: frontend/coverage

      # sonar.qualitygate.wait=true (sonar-project.properties): a failed Quality Gate fails this step.
      - name: Analyse and wait for the Quality Gate
        if: steps.config.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            ${{ vars.SONAR_PROJECT_KEY && format('-Dsonar.projectKey={0}', vars.SONAR_PROJECT_KEY) || '' }}
            ${{ vars.SONAR_ORGANIZATION && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}

  docker:
    name: Docker image (${{ matrix.image }})
    needs: [backend, frontend, sonar]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: etl
            context: .
            dockerfile: etl/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: jmip-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke:
    name: Container smoke test
    needs: [docker]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Throwaway values generated for this run only; they protect nothing and are not
      # secrets. Real values live in the platform's secret store (docs/CI_CD.md).
      - name: Generate ephemeral settings
        run: |
          for name in JMIP_DB_PASSWORD JMIP_OTP_SECRET; do
            value="$(openssl rand -hex 24)"; echo "::add-mask::$value"; echo "$name=$value" >> "$GITHUB_ENV"
          done
          key="$(openssl rand -base64 32)"; echo "::add-mask::$key"; echo "JMIP_RESUME_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"

      - name: Validate Compose files
        env:
          JMIP_PUBLIC_URL: https://jmip.example.com
          JMIP_TLS_CERT_DIR: ./certs
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.https.yml config -q

      # The production profile, as Compose runs it: Flyway migrates a fresh database and
      # every container must report healthy.
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Check health, proxy and security headers
        run: |
          curl -fsS http://localhost:8080/actuator/health/readiness
          curl -fsS http://localhost:3000/healthz
          curl -fsS http://localhost:3000/actuator/health
          curl -fsS http://localhost:3000/ | grep -q 'id="root"'
          curl -fsSI http://localhost:3000/ | grep -qi '^content-security-policy:'
          curl -fsSI http://localhost:3000/ | grep -qi '^x-content-type-options: nosniff'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/auth/me)" = "401"

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images (release tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A protected environment: add required reviewers in the repository settings to gate releases.
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: etl
            context: .
            dockerfile: etl/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/jmip-${{ matrix.image }}" >> "$GITHUB_ENV"

      # The frontend bakes its public URL in at build time; it is configuration, not a secret.
      - name: Require the public URL for the frontend
        if: matrix.image == 'frontend' && vars.JMIP_PUBLIC_URL == ''
        run: |
          echo "::error::Set the repository variable JMIP_PUBLIC_URL (e.g. https://jmip.example.com)"
          exit 1

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN only: no registry password is stored anywhere.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.JMIP_PUBLIC_URL }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
