name: CI

on:
  push:
    branches: [impl-V6]
  pull_request:
    branches: [impl-V6]

# Read-only token: the pipeline builds and tests, it never pushes or deploys.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B -ntp package -DskipTests

      # Unit and integration tests for database, backend and ETL. The integration tests
      # start PostgreSQL through Testcontainers, using the runner's Docker daemon.
      - name: Test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  frontend:
    name: Frontend install, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # The same Node major as frontend/Dockerfile.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

  docker:
    name: Docker image (${{ matrix.image }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: etl
            context: .
            dockerfile: etl/Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Compose refuses to parse without a database password. This placeholder is only
      # for validating the file; no container is started with it.
      - name: Validate docker-compose.yml
        env:
          JMIP_DB_PASSWORD: ci-validation-only
        run: docker compose config -q

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: jmip-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
