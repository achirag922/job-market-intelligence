spring:
  application:
    name: job-market-intelligence

  datasource:
    url: jdbc:postgresql://${JMIP_DB_HOST:localhost}:${JMIP_DB_PORT:5433}/${JMIP_DB_NAME:jmip}
    username: ${JMIP_DB_USERNAME:postgres}
    password: ${JMIP_DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        # Caps what a client can ask for, so one request cannot pull the whole table.
        max-page-size: 100
        one-indexed-parameters: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${JMIP_SERVER_PORT:8080}
  error:
    # Errors are rendered by GlobalExceptionHandler, not by the default error page.
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.jmip: INFO
