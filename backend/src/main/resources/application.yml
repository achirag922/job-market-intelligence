spring:
  application:
    name: job-market-intelligence

  datasource:
    url: jdbc:postgresql://${JMIP_DB_HOST:localhost}:${JMIP_DB_PORT:5433}/${JMIP_DB_NAME:jmip}
    username: ${JMIP_DB_USERNAME:postgres}
    password: ${JMIP_DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        # Caps what a client can ask for, so one request cannot pull the whole table.
        max-page-size: 100
        one-indexed-parameters: false

  servlet:
    multipart:
      # The container's limit. Kept equal to jmip.resume.storage.max-file-size so an
      # oversized upload is refused once, with one consistent message.
      max-file-size: ${JMIP_RESUME_MAX_FILE_SIZE:5MB}
      max-request-size: ${JMIP_RESUME_MAX_FILE_SIZE:5MB}

  autoconfigure:
    # Users come from the users table (AppUserDetailsService). Never create the default
    # in-memory user, whose generated password Spring Boot would print to the log.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # Verification emails. Gmail: smtp.gmail.com:587 with STARTTLS and an app password
  # (Google Account > Security > App passwords); a normal account password is refused.
  mail:
    host: ${JMIP_MAIL_HOST:smtp.gmail.com}
    port: ${JMIP_MAIL_PORT:587}
    username: ${JMIP_MAIL_USERNAME:}
    password: ${JMIP_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${JMIP_SERVER_PORT:8080}
  servlet:
    session:
      # Browser sign-in (V6.10.2). The id is only ever in this cookie, never in a URL.
      timeout: ${JMIP_SESSION_TIMEOUT:8h}
      tracking-modes: cookie
      cookie:
        name: ${JMIP_SESSION_COOKIE_NAME:JMIP_SESSION}
        http-only: true
        # Off for plain-HTTP local development; the prod profile turns it on.
        secure: ${JMIP_SESSION_COOKIE_SECURE:false}
        # Strict: the cookie is never sent on a request started by another site.
        same-site: ${JMIP_SESSION_COOKIE_SAME_SITE:strict}
        path: /
  error:
    # Errors are rendered by GlobalExceptionHandler, not by the default error page.
    include-message: never
    include-stacktrace: never

management:
  health:
    mail:
      # A mail server outage must not mark the whole API unhealthy; delivery failures are
      # handled per email (the user can resend).
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jmip:
  resume:
    storage:
      # Relative by default so nothing assumes a particular machine's layout. Override
      # with an absolute path per environment.
      directory: ${JMIP_RESUME_DIR:./data/resumes}
      # Must stay in step with spring.servlet.multipart.max-file-size above, so the
      # container and the upload validation reject at the same size.
      max-file-size: ${JMIP_RESUME_MAX_FILE_SIZE:5MB}
      allowed-content-types: application/pdf
    privacy:
      # base64 of a 256-bit key (`openssl rand -base64 32`). Encrypts stored resume files and
      # extracted text. Required in production; blank here stores them unencrypted.
      encryption-key: ${JMIP_RESUME_ENCRYPTION_KEY:}
      # Delete resumes this long after upload, e.g. 365d. 0s keeps them until the owner deletes
      # them. Anything else must be at least 1d.
      retention: ${JMIP_RESUME_RETENTION:0s}
      retention-cron: ${JMIP_RESUME_RETENTION_CRON:0 30 3 * * *}

  analytics:
    snapshots:
      # The skill demand history is derived from jobs.posted_date, so rebuilding is always
      # safe. Rebuilding at startup means a fresh ETL load shows up without waiting for the
      # scheduled run — the API has no other way of knowing the ETL finished.
      refresh-on-startup: ${JMIP_SNAPSHOT_REFRESH_ON_STARTUP:true}
      cron: ${JMIP_SNAPSHOT_CRON:0 0 2 * * *}

  cors:
    # Origins the browser frontend is served from. Comma separated via
    # JMIP_CORS_ALLOWED_ORIGINS when deploying somewhere else.
    allowed-origins: ${JMIP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  verification:
    # smtp emails the 6-digit code; log prints it to this log (local development only).
    delivery: ${JMIP_VERIFICATION_DELIVERY:log}
    # HMAC key for stored codes. Required in production; blank here means a random key per start.
    secret: ${JMIP_OTP_SECRET:}
    code-ttl: ${JMIP_OTP_TTL:10m}
    resend-cooldown: ${JMIP_OTP_RESEND_COOLDOWN:60s}
    max-attempts: ${JMIP_OTP_MAX_ATTEMPTS:5}
    mail-from: ${JMIP_MAIL_FROM:}

  # V5 assistant. The API key has no default and no value in this file: it comes from the
  # environment, it is never logged, and it never reaches the browser — every model call is
  # made by the server. With no key set the application starts normally and the assistant
  # reports itself unavailable; nothing else is affected.
  security:
    # Per client address, per minute. Protects a single instance from a runaway client.
    rate-limit-enabled: ${JMIP_RATE_LIMIT_ENABLED:true}
    assistant-per-minute: ${JMIP_RATE_LIMIT_ASSISTANT_PER_MINUTE:20}
    uploads-per-minute: ${JMIP_RATE_LIMIT_UPLOADS_PER_MINUTE:10}
    auth-per-minute: ${JMIP_RATE_LIMIT_AUTH_PER_MINUTE:10}
    assistant-max-body-bytes: ${JMIP_ASSISTANT_MAX_BODY_BYTES:16384}
    password:
      # bcrypt work factor (log2). 12 is about a quarter of a second per hash; raise it as
      # hardware gets faster. Existing hashes keep working at their original strength.
      bcrypt-strength: ${JMIP_PASSWORD_BCRYPT_STRENGTH:12}

  ai:
    provider: ${AI_PROVIDER:anthropic}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:claude-opus-5}
    # Deliberately unset. The current Claude models removed sampling controls and reject
    # temperature with a 400, so it is sent only where it is configured and supported.
    temperature: ${AI_TEMPERATURE:}
    max-tokens: ${AI_MAX_TOKENS:8192}
    timeout: ${AI_TIMEOUT:30s}

  assistant:
    # The model proposes how many rows a question wants; these are the ceilings the
    # backend applies regardless of what it proposed.
    default-limit: ${JMIP_ASSISTANT_DEFAULT_LIMIT:10}
    max-limit: ${JMIP_ASSISTANT_MAX_LIMIT:25}
    max-job-results: ${JMIP_ASSISTANT_MAX_JOB_RESULTS:20}
    # Fewest postings in one currency before a salary range is worth reporting.
    min-salary-sample: ${JMIP_ASSISTANT_MIN_SALARY_SAMPLE:5}
    max-question-length: ${JMIP_ASSISTANT_MAX_QUESTION_LENGTH:500}

logging:
  level:
    com.jmip: INFO
