# Production profile: SPRING_PROFILES_ACTIVE=prod (the Docker Compose default).
#
# Layered over application.yml. It removes the local-development fallbacks that are unsafe
# outside a developer machine: every value below without a default must come from the
# environment, and the application refuses to start when one is missing rather than
# silently connecting as postgres/postgres or accepting browser calls from localhost.

spring:
  datasource:
    # V10.1: sslmode=prefer is the driver default; set JMIP_DB_SSL_MODE=require (or verify-full) for a managed database.
    url: jdbc:postgresql://${JMIP_DB_HOST}:${JMIP_DB_PORT:5432}/${JMIP_DB_NAME}?sslmode=${JMIP_DB_SSL_MODE:prefer}
    username: ${JMIP_DB_USERNAME}
    password: ${JMIP_DB_PASSWORD}
    hikari:
      # V10.2: named, so database-side views (pg_stat_activity) and metrics show which service holds a connection.
      pool-name: jmip-backend
      # Keep pool size x instances (+ the ETL pool) below the database's connection limit.
      maximum-pool-size: ${JMIP_DB_POOL_SIZE:10}
      minimum-idle: ${JMIP_DB_POOL_MIN_IDLE:2}
      # Fail a request after this long waiting for a connection instead of hanging.
      connection-timeout: ${JMIP_DB_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${JMIP_DB_IDLE_TIMEOUT:600000}
      # Retire connections before cloud load balancers or NAT gateways silently drop idle ones (often 30-60 min).
      max-lifetime: ${JMIP_DB_MAX_LIFETIME:1500000}
      keepalive-time: ${JMIP_DB_KEEPALIVE_TIME:300000}
      # 0 = off. Set e.g. 60000 to log a stack trace for a connection held longer than that.
      leak-detection-threshold: ${JMIP_DB_LEAK_DETECTION_THRESHOLD:0}
      data-source-properties:
        ApplicationName: jmip-backend
        tcpKeepAlive: true

  flyway:
    # Migrations only ever move forward in production.
    clean-disabled: true
    # V10.2: refuse to start on an edited, missing or misnamed migration instead of guessing.
    validate-on-migrate: true
    validate-migration-naming: true
    out-of-order: false
    baseline-on-migrate: false
    # A managed database may still be starting when the container does.
    connect-retries: ${JMIP_FLYWAY_CONNECT_RETRIES:10}

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  # Finish in-flight requests on SIGTERM (docker stop) before exiting.
  shutdown: graceful
  # Behind nginx or a load balancer: honour X-Forwarded-* for scheme and client address.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # HTTPS only in production. Browsers still accept it on http://localhost.
        secure: ${JMIP_SESSION_COOKIE_SECURE:true}

management:
  endpoint:
    health:
      # The status alone is enough for health checks; component details (database
      # product, disk space) are not for anonymous callers.
      show-details: never

jmip:
  verification:
    # Real deliveries unless explicitly set to log.
    delivery: ${JMIP_VERIFICATION_DELIVERY:smtp}
  resume:
    storage:
      # An explicit location, usually a mounted volume. The relative default is for local use.
      directory: ${JMIP_RESUME_DIR}
  cors:
    allowed-origins: ${JMIP_CORS_ALLOWED_ORIGINS}

logging:
  # V7.8: one JSON object per line (Elastic Common Schema), with the request or job id from
  # the MDC. JMIP_LOG_FORMAT may also be logstash or gelf.
  structured:
    format:
      console: ${JMIP_LOG_FORMAT:ecs}
  level:
    root: WARN
    com.jmip: ${JMIP_LOG_LEVEL:INFO}
    # Keep the lines that say which migrations ran and that the application is up.
    org.flywaydb.core.internal.command: INFO
    org.springframework.boot.web.embedded.tomcat.TomcatWebServer: INFO
