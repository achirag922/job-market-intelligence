# HTTPS deployment on top of docker-compose.yml. nginx terminates TLS with your certificate,
# redirects HTTP to HTTPS (301) and sends HSTS; the backend and database stop being published
# on the host at all, so the only way in is HTTPS through nginx.
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
#
# Needs, in .env (see .env.example):
#   JMIP_PUBLIC_URL=https://jmip.example.com            the address users open
#   JMIP_CORS_ALLOWED_ORIGINS=https://jmip.example.com  the same origin
#   JMIP_TLS_CERT_DIR=/etc/letsencrypt/live/jmip.example.com
#       a directory holding fullchain.pem and privkey.pem (e.g. from certbot); mounted
#       read-only, never copied into an image
#
# Behind a cloud load balancer that terminates TLS itself, use docker-compose.yml alone: nginx
# passes the balancer's X-Forwarded-Proto: https on, and the redirect and HSTS belong to the
# balancer.

services:
  frontend:
    build:
      args:
        VITE_API_BASE_URL: ${JMIP_PUBLIC_URL:?Set JMIP_PUBLIC_URL=https://your-host in .env}
    ports: !override
      - "${JMIP_HTTP_PORT:-80}:80"
      - "${JMIP_HTTPS_PORT:-443}:443"
    volumes:
      - ./frontend/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${JMIP_TLS_CERT_DIR:?Set JMIP_TLS_CERT_DIR to the directory with fullchain.pem and privkey.pem}:/etc/nginx/certs:ro

  backend:
    # Reached only through nginx on the internal network.
    ports: !reset []
    environment:
      JMIP_SESSION_COOKIE_SECURE: "true"
      JMIP_CORS_ALLOWED_ORIGINS: ${JMIP_CORS_ALLOWED_ORIGINS:?Set JMIP_CORS_ALLOWED_ORIGINS=https://your-host in .env}

  postgres:
    ports: !reset []
