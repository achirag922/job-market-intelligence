# JMIP in containers: PostgreSQL, the Spring Boot API, the React frontend and the ETL.
#
#   cp .env.example .env            # then set JMIP_DB_PASSWORD
#   docker compose up -d --build    # postgres, backend, frontend
#   docker compose --profile etl run --rm etl   # load the sample dataset
#
# Open http://localhost:3000. Values come from .env; nothing secret is written here.

name: jmip

x-database-env: &database-env
  JMIP_DB_HOST: postgres
  JMIP_DB_PORT: 5432
  JMIP_DB_NAME: ${JMIP_DB_NAME:-jmip}
  JMIP_DB_USERNAME: ${JMIP_DB_USERNAME:-jmip}
  JMIP_DB_PASSWORD: ${JMIP_DB_PASSWORD:?Set JMIP_DB_PASSWORD in .env}
  # prod removes the local-development fallbacks (see application-prod.yml).
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  JMIP_LOG_LEVEL: ${JMIP_LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${JMIP_DB_NAME:-jmip}
      POSTGRES_USER: ${JMIP_DB_USERNAME:-jmip}
      POSTGRES_PASSWORD: ${JMIP_DB_PASSWORD:?Set JMIP_DB_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    ports:
      # Host port differs from a local PostgreSQL on 5433; bound to localhost only.
      - "127.0.0.1:${JMIP_DB_EXPOSED_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database-env
      # The browser reaches the API through the frontend's origin; the direct port is
      # listed too so the API can be called from a locally run Vite dev server.
      JMIP_CORS_ALLOWED_ORIGINS: ${JMIP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      AI_TIMEOUT: ${AI_TIMEOUT:-30s}
      JMIP_DB_POOL_SIZE: ${JMIP_DB_POOL_SIZE:-10}
    volumes:
      - resume-data:/app/data/resumes
    ports:
      - "${JMIP_BACKEND_PORT:-8080}:8080"
    # Flyway runs on startup; if the database is still settling the process exits and is retried.
    restart: on-failure:5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${JMIP_PUBLIC_URL:-http://localhost:3000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${JMIP_FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    profiles: ["etl"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database-env
      JMIP_ETL_JOB: ${JMIP_ETL_JOB:-ingestJobPostings}
    volumes:
      - ./etl/data/raw:/data/raw:ro
    command: ["inputFile=/data/raw/${JMIP_ETL_INPUT_FILE:-synthetic-job-postings-v1.json}"]

volumes:
  postgres-data:
  resume-data:
