# V10.4: Sonar analysis of JMIP (SonarCloud or a self-hosted SonarQube), run by the CI "sonar" job.
# The token and, for SonarQube, the server URL come from CI secrets; nothing secret lives here.
# The key and organization must match the SonarCloud project (Administration > Update key).
sonar.projectKey=achirag922_job-market-intelligence
sonar.organization=achirag922
sonar.projectName=Job Market Intelligence Platform (JMIP)
sonar.sourceEncoding=UTF-8

# Production code: backend and ETL (Java 17) and the React frontend (TypeScript).
sonar.sources=backend/src/main/java,etl/src/main/java,frontend/src
sonar.tests=backend/src/test/java,etl/src/test/java,frontend/src
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**
sonar.test.inclusions=**/src/test/java/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Java: compiled classes from the backend job.
sonar.java.source=17
sonar.java.binaries=backend/target/classes,etl/target/classes
sonar.java.test.binaries=backend/target/test-classes,etl/target/test-classes

# Coverage and test results produced by mvn verify (JaCoCo) and npm run test:coverage (V8 -> lcov).
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml,etl/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.junit.reportPaths=backend/target/surefire-reports,etl/target/surefire-reports

# Bootstrapping code with no logic to test.
sonar.coverage.exclusions=**/*Application.java,frontend/src/main.tsx

# Fail the scanner (and so the CI job) when the Quality Gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
